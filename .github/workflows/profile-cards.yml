name: Refresh profile cards

on:
  schedule:
    - cron: "17 0 * * 1" # Mondays, 08:17 in Manila
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render.py
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render cards
        run: python scripts/render.py jayeuse
        env:
          # A PROFILE_TOKEN secret is optional; the default token reads public data.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
      - name: Commit changed cards
        run: |
          git diff --quiet -- assets && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh profile cards"
          git push
